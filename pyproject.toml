[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drs-gk-f-16"
version = "0.1.0"
description = "F-16 canyon flight with distributionally robust Gatekeeper supervision"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Daniel Cherenson"}]
dependencies = [
    "numpy>=2.1,<3", "scipy>=1.16,<2", "jax>=0.9.2,<0.10",
    "jax[cuda13]>=0.9.2,<0.10; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "jsbsim>=1.3.0,<1.4", "gymnasium>=1.2,<2",
    "matplotlib>=3.10,<4", "moderngl>=5.12,<6", "pygame>=2.6,<3",
    "imageio>=2.37,<3", "imageio-ffmpeg>=0.6,<1", "pillow>=11,<13",
    "tifffile>=2025.1",
]

[project.scripts]
drs-f16 = "src.demo:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["assets/**/*", "visualization/*.obj", "visualization/*.vert", "visualization/*.frag"]

